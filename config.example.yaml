# ──────────────────────────────────────────────────────────────────────────────
# Camera-Client Configuration — Example
# ──────────────────────────────────────────────────────────────────────────────
# Copy this file to config.yaml and adjust values for your setup.
#
# Environment variable overrides:
#   CAMERA__PI__HOST=192.0.2.20     →  pi.host = "192.0.2.20"
#   CAMERA__AI__DEFAULT_MODEL=yolo26s.pt  →  ai.default_model = "yolo26s.pt"
# ──────────────────────────────────────────────────────────────────────────────

pi:
  host: "camera.example.invalid"          # Replace with your Pi's IP address
  video_port: 8888
  ws_port: 8889
  auth_token: ""                 # Must match server.auth_token below (empty = no auth)
  default_resolution: [640, 480]
  fps_min: 5
  fps_max: 30
  fps_default: 30

server:
  video_port: 8888
  ws_port: 8889
  auth_token: ""                 # Shared secret required in WebSocket control messages
  default_width: 640
  default_height: 480
  default_fps: 30
  default_bitrate: 2000000       # 2 Mbps
  pid_file: "/tmp/camera_server.pid"

ai:
  default_model: "yolo26n.pt"
  vlm_model_id: "google/gemma-4-E2B-it"
  animal_embed_model: "facebook/dinov3-vits16-pretrain-lvd1689m"
  face_threshold: 0.35
  animal_threshold: 0.85
  face_history_len: 5
  animal_history_len: 5
  detection_classes: [0, 15, 16]
  iou_threshold: 0.4
  person_class: 0                # COCO class id used for face recognition
  animal_classes: [15, 16]       # COCO class ids used for animal recognition
  face_recheck_interval: 10      # Re-identify a tracked person every N frames
  animal_recheck_interval: 10    # Re-identify a tracked animal every N frames
  max_cached_models: 2           # Max YOLO/SAM models kept in VRAM at once

alerts:
  cooldown_seconds: 300
  alert_classes:
    - { id: 0,  name: "person" }
    - { id: 15, name: "cat" }
    - { id: 16, name: "dog" }

email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  timeout_seconds: 30

stream:
  jpeg_quality: 80

ui:
  server_host: "127.0.0.1"
  server_port: 7860
  share: false                   # true requires both login fields below
  auth_username: ""              # Set both fields (or CAMERA__UI__AUTH_PASSWORD env
  auth_password: ""              # var) to protect the UI with a login
  log_max_lines: 20
  log_refresh_interval: 1

camera:
  valid_resolutions:
    - [640, 480]
    - [1296, 972]
    - [1920, 1080]
    - [2592, 1944]
